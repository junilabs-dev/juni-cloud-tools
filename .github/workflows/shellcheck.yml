name: ShellCheck

on:
  push:
    paths:
      - 'bash/**/*.sh'
  pull_request:
    paths:
      - 'bash/**/*.sh'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        continue-on-error: true
        with:
          scandir: './bash'
